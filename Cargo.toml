[workspace]
members = [
  "minidodo-cli",
  "minidodo-core",
  "minidodo-infra",
  "minidodo-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8.6" }
tower = { version = "0.5.2" }
tower-layer = "0.3.3"
tower-http = { version = "0.6.6", features = ["trace", "cors", "normalize-path"] }
sqlx = { version = "0.8.6", features = [
  "postgres",
  "chrono",
  "uuid",
  "runtime-tokio",
  "migrate",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
uuid = { version = "1.18.0", features = ["serde", "v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
  "registry",
  "env-filter",
  "json",
] }
snafu = "0.8.4"
thiserror = "2.0.11"
clap = { version = "4.5", features = ["derive"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum", "vendored"] }
validator = { version = "0.20", features = ["derive"] }
sha2 = "0.10.8"
hmac = "0.12.1"
hex = "0.4.3"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
uncased = { version = "0.9.10", features = ["serde"] }

minidodo-core = { path = "minidodo-core" }
minidodo-infra = { path = "minidodo-infra" }
minidodo-server = { path = "minidodo-server" }
